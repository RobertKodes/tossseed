<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1610" />
    <meta name="color-scheme" content="dark" />
    <title>tossseed</title>
    <meta
      name="description"
      content="Grab a felt ball, fling it, and hash the flight into a Solana-ish address."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Petrona:ital,wght@0,400;0,500;1,400;1,560&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="desk" class="desk" data-state="ready">
      <div class="grain" aria-hidden="true"></div>
      <header class="mast">
        <h1>tossseed</h1>
        <p>flight as input</p>
      </header>
      <div class="lamp" id="lamp">ready</div>

      <main class="stage-wrap">
        <p class="status" id="status">grab the ball — then fling it</p>

        <canvas
          id="stage"
          class="stage"
          width="720"
          height="440"
          role="img"
          aria-label="Felt stage. Grab the ball, drag, and release to toss."
        ></canvas>

        <section id="plate" class="plate" hidden>
          <p class="plate-kicker">callsign</p>
          <code id="address" class="address"></code>
          <div id="chips" class="chips"></div>
          <p id="crumb" class="crumb"></p>
          <div class="acts">
            <button id="copy" class="act" type="button">copy address</button>
            <button id="again" class="act ghost" type="button">toss again</button>
          </div>
        </section>
      </main>

      <footer class="well">
        <p class="note">
          Preview seed from the toss — not a program-derived PDA. Sibling to
          <a href="https://robertkodes.github.io/keyseed/">keyseed</a>,
          <a href="https://robertkodes.github.io/tiltseed/">tiltseed</a>,
          <a href="https://robertkodes.github.io/micseed/">micseed</a>,
          <a href="https://robertkodes.github.io/camseed/">camseed</a>,
          <a href="https://robertkodes.github.io/drawseed/">drawseed</a>.
          Grab, fling, hash. Don’t send funds to a bounce.
        </p>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
